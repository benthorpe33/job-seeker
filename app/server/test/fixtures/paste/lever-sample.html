<!doctype html>
<html lang="en">
<head><title>Apply for Senior Software Engineer · Acme</title></head>
<body>
<div class="application-page">
  <header class="posting-header">
    <h2>Apply for this job</h2>
  </header>
  <form id="application-form" action="/apply/submit" method="POST">
    <div class="application-field">
      <label class="application-label" for="resume">Resume/CV<span class="required">*</span></label>
      <input type="file" id="resume" name="resume" required>
    </div>
    <div class="application-field">
      <label class="application-label" for="full_name">Full name<span class="required">*</span></label>
      <input type="text" id="full_name" name="name" required>
    </div>
    <div class="application-field">
      <label class="application-label" for="email">Email<span class="required">*</span></label>
      <input type="text" id="email" name="email" required>
    </div>
    <div class="application-field">
      <label class="application-label" for="phone">Phone</label>
      <input type="text" id="phone" name="phone">
    </div>
    <div class="application-field">
      <label class="application-label" for="urls[LinkedIn]">LinkedIn URL</label>
      <input type="text" id="urls[LinkedIn]" name="urls[LinkedIn]">
    </div>
    <div class="application-field">
      <label class="application-label" for="urls[GitHub]">GitHub URL</label>
      <input type="text" id="urls[GitHub]" name="urls[GitHub]">
    </div>
    <div class="application-additional-information">
      <h4 class="application-additional-information-title">Additional information</h4>
      <ul class="application-additional-questions">
        <li>
          <label class="application-question">
            <span class="text">Why are you interested in working at Acme?<span class="required">*</span></span>
            <textarea name="cards[abc][field0]" rows="6" required></textarea>
          </label>
        </li>
        <li>
          <label class="application-question">
            <span class="text">Tell us about a recent project you led from start to finish.<span class="required">*</span></span>
            <textarea name="cards[abc][field1]" rows="6" required></textarea>
          </label>
        </li>
        <li>
          <label class="application-question">
            <span class="text">What is your earliest available start date?</span>
            <input type="text" name="cards[abc][field2]">
          </label>
        </li>
        <li>
          <label class="application-question">
            <span class="text">Are you authorized to work in the United States?<span class="required">*</span></span>
            <textarea name="cards[abc][field3]" rows="3" required></textarea>
          </label>
        </li>
        <li>
          <label class="application-question">
            <span class="text">Describe a time when you had to make a difficult technical trade-off.</span>
            <textarea name="cards[abc][field4]" rows="6"></textarea>
          </label>
        </li>
      </ul>
    </div>
  </form>
</div>
</body>
</html>
