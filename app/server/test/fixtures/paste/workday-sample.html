<!doctype html>
<html>
<head><title>Workday — Apply</title></head>
<body>
<div data-automation-id="applicationPage">
  <h1>My Information</h1>
  <div data-automation-id="formField-firstName">
    <label id="lbl-firstName" for="input-firstName">First Name</label>
    <input type="text" id="input-firstName" name="firstName" required>
  </div>
  <div data-automation-id="formField-lastName">
    <label id="lbl-lastName" for="input-lastName">Last Name</label>
    <input type="text" id="input-lastName" name="lastName" required>
  </div>
  <div data-automation-id="formField-email">
    <label id="lbl-email" for="input-email">Email Address</label>
    <input type="text" id="input-email" name="email" required>
  </div>

  <h1>Application Questions</h1>

  <div data-automation-id="formField-q1">
    <span id="lbl-q1">How did you hear about this opportunity at our company?</span>
    <textarea id="input-q1" name="q1" aria-labelledby="lbl-q1" aria-required="true"></textarea>
  </div>

  <div data-automation-id="formField-q2">
    <span id="lbl-q2">Please describe your most relevant project experience.</span>
    <textarea id="input-q2" name="q2" aria-labelledby="lbl-q2" aria-required="true"></textarea>
  </div>

  <div data-automation-id="formField-q3">
    <label for="input-q3">What is your salary expectation for this role?</label>
    <input type="text" id="input-q3" name="q3">
  </div>

  <div data-automation-id="formField-q4">
    <label for="input-q4">Why do you want to leave your current role?</label>
    <textarea id="input-q4" name="q4"></textarea>
  </div>

  <div data-automation-id="formField-q5">
    <textarea id="input-q5" name="q5" aria-label="Tell us about a time you mentored a junior engineer."></textarea>
  </div>
</div>
</body>
</html>
